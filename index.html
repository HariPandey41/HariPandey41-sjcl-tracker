<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SJCL — Sanjen Jalvidyut Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0A1E22;
    --panel: #11292E;
    --panel-border: #1D3B40;
    --accent: #3FBFAE;
    --accent-soft: rgba(63,191,174,0.12);
    --gain: #63C77B;
    --loss: #E2725B;
    --text: #EAF3F1;
    --text-muted: #7E9FA0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:920px;margin:0 auto;padding:32px 20px 64px;}

  /* Hero */
  .hero{
    position:relative;
    overflow:hidden;
    border:1px solid var(--panel-border);
    border-radius:16px;
    background:linear-gradient(180deg, #0D2429 0%, #0A1E22 100%);
    padding:36px 28px 28px;
    margin-bottom:22px;
  }
  .flow-lines{position:absolute;inset:0;opacity:0.35;pointer-events:none;}
  .flow-lines path{
    fill:none;
    stroke:var(--accent);
    stroke-width:1;
    animation: drift 14s ease-in-out infinite;
  }
  .flow-lines path:nth-child(2){animation-duration:18s;stroke-opacity:0.6;animation-delay:-4s;}
  .flow-lines path:nth-child(3){animation-duration:22s;stroke-opacity:0.35;animation-delay:-9s;}
  @keyframes drift{
    0%,100%{ transform: translateX(0); }
    50%{ transform: translateX(-24px); }
  }
  @media (prefers-reduced-motion: reduce){
    .flow-lines path{ animation:none; }
  }

  .eyebrow{
    position:relative;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--accent);
    margin:0 0 6px;
  }
  h1{
    position:relative;
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:22px;
    margin:0 0 22px;
    color:var(--text);
  }
  h1 span{color:var(--text-muted); font-weight:500;}

  .price-row{position:relative; display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;}
  .price{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:52px;
    line-height:1;
  }
  .change{
    font-family:'IBM Plex Mono', monospace;
    font-size:15px;
    padding:5px 10px;
    border-radius:8px;
  }
  .change.up{color:var(--gain); background:rgba(99,199,123,0.12);}
  .change.down{color:var(--loss); background:rgba(226,114,91,0.12);}
  .as-of{position:relative; margin-top:8px; font-size:12px; color:var(--text-muted); font-family:'IBM Plex Mono', monospace;}

  /* Range toggle */
  .ranges{display:flex; gap:6px; margin:22px 0 14px; flex-wrap:wrap;}
  .ranges button{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    background:transparent;
    border:1px solid var(--panel-border);
    color:var(--text-muted);
    padding:6px 12px;
    border-radius:20px;
    cursor:pointer;
    transition: all 0.15s ease;
  }
  .ranges button:hover{border-color:var(--accent); color:var(--text);}
  .ranges button.active{background:var(--accent-soft); border-color:var(--accent); color:var(--accent);}

  /* Chart panel */
  .chart-panel{
    border:1px solid var(--panel-border);
    border-radius:16px;
    background:var(--panel);
    padding:20px 16px 8px;
    margin-bottom:22px;
  }
  #chart-container{height:320px;}
  #price-chart{display:block;width:100%;height:100%;}

  /* Stats grid */
  .stats{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:1px;
    background:var(--panel-border);
    border:1px solid var(--panel-border);
    border-radius:16px;
    overflow:hidden;
  }
  .stat{background:var(--panel); padding:16px 18px;}
  .stat-label{font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-muted); margin-bottom:6px;}
  .stat-value{font-family:'IBM Plex Mono', monospace; font-size:17px; font-weight:500;}

  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--text-muted);
    font-size:14px;
    line-height:1.6;
  }
  .empty-state code{
    background:var(--panel-border);
    padding:2px 6px;
    border-radius:4px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
  }

  footer{
    margin-top:26px;
    text-align:center;
    font-size:11px;
    color:var(--text-muted);
    font-family:'IBM Plex Mono', monospace;
  }
  footer a{color:var(--accent); text-decoration:none;}

  @media (max-width:560px){
    .price{font-size:38px;}
    .stats{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <svg class="flow-lines" viewBox="0 0 900 120" preserveAspectRatio="none">
      <path d="M-50,30 C150,10 250,60 450,40 C650,20 750,70 950,50" />
      <path d="M-50,60 C150,80 250,40 450,70 C650,100 750,50 950,80" />
      <path d="M-50,95 C150,75 250,105 450,90 C650,75 750,110 950,95" />
    </svg>
    <p class="eyebrow">NEPSE · Hydropower Sector</p>
    <h1>SJCL <span>— Sanjen Jalvidyut Company Limited</span></h1>
    <div class="price-row">
      <div class="price" id="current-price">—</div>
      <div class="change" id="current-change">—</div>
    </div>
    <div class="as-of" id="as-of">Loading data…</div>
  </div>

  <div class="ranges" id="ranges">
    <button data-range="30">1M</button>
    <button data-range="90">3M</button>
    <button data-range="180">6M</button>
    <button data-range="365" class="active">1Y</button>
    <button data-range="all">All</button>
  </div>

  <div class="chart-panel">
    <div id="chart-container"><canvas id="price-chart"></canvas></div>
  </div>

  <div class="stats" id="stats"></div>

  <footer>
    Data refreshed automatically via GitHub Actions from NEPSE public price history · Not investment advice
  </footer>
</div>

<script>
const DATA_URL = './data/sjcl.json';
let allData = [];
let chart = null;
let currentRangeDays = 365;

function showDataError(message){
  document.querySelector('.wrap').innerHTML = `
    <div class="hero">
      <p class="eyebrow">NEPSE · Hydropower Sector</p>
      <h1>SJCL <span>— Sanjen Jalvidyut Company Limited</span></h1>
    </div>
    <div class="empty-state">
      ${message}<br/>
      Confirm that <code>data/sjcl.json</code> exists in the GitHub Pages root and run
      <code>Update SJCL price data</code> from the Actions tab.
    </div>`;
}

async function loadData(){
  try{
    const res = await fetch(`${DATA_URL}?v=${Date.now()}`, { cache: 'no-store' });
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const payload = await res.json();
    if(!Array.isArray(payload)) throw new Error('data/sjcl.json is not a JSON array');
    allData = payload
      .filter(row => row && typeof row.date === 'string' && Number.isFinite(Number(row.close)))
      .map(row => ({
        ...row,
        close: Number(row.close),
        open: row.open == null ? null : Number(row.open),
        high: row.high == null ? null : Number(row.high),
        low: row.low == null ? null : Number(row.low),
        volume: row.volume == null ? null : Number(row.volume),
      }))
      .filter(row => Number.isFinite(row.close))
      .sort((a, b) => a.date.localeCompare(b.date));
    if(allData.length === 0) throw new Error('no valid SJCL rows');
  }catch(e){
    allData = [];
    showDataError(`Unable to load SJCL data (${e.message}).`);
    return;
  }

  if(!allData || allData.length === 0){
    showDataError('No SJCL trading data is available yet.');
    return;
  }

  renderAll();
  document.querySelectorAll('.ranges button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.ranges button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      currentRangeDays = btn.dataset.range === 'all' ? 'all' : parseInt(btn.dataset.range);
      renderChart();
    });
  });
}

function filteredData(){
  if(currentRangeDays === 'all') return allData;
  return allData.slice(-currentRangeDays);
}

function renderAll(){
  const latest = allData[allData.length - 1];
  const prev = allData.length > 1 ? allData[allData.length - 2] : latest;
  const delta = latest.close - prev.close;
  const pct = (delta / prev.close) * 100;
  const up = delta >= 0;

  document.getElementById('current-price').textContent = 'Rs ' + latest.close.toFixed(2);
  const changeEl = document.getElementById('current-change');
  changeEl.textContent = (up ? '▲ ' : '▼ ') + Math.abs(delta).toFixed(2) + '  (' + Math.abs(pct).toFixed(2) + '%)';
  changeEl.className = 'change ' + (up ? 'up' : 'down');
  document.getElementById('as-of').textContent = 'As of ' + latest.date + ' · ' + allData.length + ' trading days tracked';

  const highs = allData.map(d=>d.high ?? d.close);
  const lows = allData.map(d=>d.low ?? d.close);
  const vol = latest.volume;

  const stats = [
    ['Open', latest.open != null ? 'Rs ' + latest.open.toFixed(2) : '—'],
    ['Day High', latest.high != null ? 'Rs ' + latest.high.toFixed(2) : '—'],
    ['Day Low', latest.low != null ? 'Rs ' + latest.low.toFixed(2) : '—'],
    ['Prev Close', 'Rs ' + prev.close.toFixed(2)],
    ['Volume', vol != null ? Math.round(vol).toLocaleString() : '—'],
    ['52W High', 'Rs ' + Math.max(...highs.slice(-365)).toFixed(2)],
    ['52W Low', 'Rs ' + Math.min(...lows.slice(-365)).toFixed(2)],
    ['All-time High', 'Rs ' + Math.max(...highs).toFixed(2)],
    ['All-time Low', 'Rs ' + Math.min(...lows).toFixed(2)],
  ];

  document.getElementById('stats').innerHTML = stats.map(([label, value])=>`
    <div class="stat">
      <div class="stat-label">${label}</div>
      <div class="stat-value">${value}</div>
    </div>`).join('');

  renderChart();
}

function renderChart(){
  const data = filteredData();
  const canvas = document.getElementById('price-chart');
  if(!canvas || data.length === 0) return;

  const rect = canvas.getBoundingClientRect();
  const width = Math.max(320, Math.round(rect.width || 800));
  const height = Math.max(220, Math.round(rect.height || 320));
  const dpr = window.devicePixelRatio || 1;
  canvas.width = width * dpr;
  canvas.height = height * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
  const muted = getComputedStyle(document.documentElement).getPropertyValue('--text-muted').trim();
  const border = getComputedStyle(document.documentElement).getPropertyValue('--panel-border').trim();
  const closes = data.map(row => row.close);
  const min = Math.min(...closes);
  const max = Math.max(...closes);
  const span = Math.max(max - min, 1);
  const pad = { top: 18, right: 14, bottom: 34, left: 54 };
  const plotWidth = width - pad.left - pad.right;
  const plotHeight = height - pad.top - pad.bottom;
  const x = index => pad.left + (data.length === 1 ? plotWidth / 2 : index * plotWidth / (data.length - 1));
  const y = value => pad.top + (max - value) * plotHeight / span;

  ctx.clearRect(0, 0, width, height);
  ctx.font = "10px 'IBM Plex Mono', monospace";
  ctx.lineWidth = 1;
  ctx.strokeStyle = border;
  ctx.fillStyle = muted;
  ctx.textAlign = 'right';
  for(let i = 0; i <= 4; i++){
    const value = min + span * i / 4;
    const lineY = y(value);
    ctx.beginPath();
    ctx.moveTo(pad.left, lineY);
    ctx.lineTo(width - pad.right, lineY);
    ctx.stroke();
    ctx.fillText(`Rs ${value.toFixed(0)}`, pad.left - 8, lineY + 3);
  }

  ctx.textAlign = 'center';
  const tickCount = Math.min(6, data.length);
  for(let i = 0; i < tickCount; i++){
    const index = Math.round(i * (data.length - 1) / Math.max(tickCount - 1, 1));
    ctx.fillText(data[index].date, x(index), height - 10);
  }

  ctx.beginPath();
  data.forEach((row, index) => index === 0 ? ctx.moveTo(x(index), y(row.close)) : ctx.lineTo(x(index), y(row.close)));
  ctx.lineTo(x(data.length - 1), pad.top + plotHeight);
  ctx.lineTo(x(0), pad.top + plotHeight);
  ctx.closePath();
  const fill = ctx.createLinearGradient(0, pad.top, 0, pad.top + plotHeight);
  fill.addColorStop(0, 'rgba(63,191,174,0.28)');
  fill.addColorStop(1, 'rgba(63,191,174,0)');
  ctx.fillStyle = fill;
  ctx.fill();

  ctx.beginPath();
  data.forEach((row, index) => index === 0 ? ctx.moveTo(x(index), y(row.close)) : ctx.lineTo(x(index), y(row.close)));
  ctx.strokeStyle = accent;
  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.stroke();
}

loadData();
</script>
</body>
</html>
