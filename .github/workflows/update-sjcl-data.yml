name: Update SJCL price data

on:
  workflow_dispatch:
  schedule:
    # Sunday–Thursday at 15:15 Nepal time (09:30 UTC).
    - cron: "30 9 * * 0-4"

permissions:
  contents: write

concurrency:
  group: update-sjcl-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Fetch and update SJCL history
        run: python scripts/update_data.py

      - name: Commit refreshed data
        run: |
          if git diff --quiet -- data/sjcl.json; then
            echo "No new SJCL trading records."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sjcl.json
          git commit -m "Update SJCL price data"
          git push
